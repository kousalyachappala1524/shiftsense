name: Keep demo awake

# Streamlit Community Cloud sleeps apps that have had no visitors for a while.
# This opens the public demo every 6 hours and clicks "wake" if it is asleep.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Visit the demo and wake it if needed
        run: python scripts/keep_awake.py https://shiftsense-demo.streamlit.app/
      - name: Keep failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
